[tool.poetry]
name = "ghost"
version = "1.0.0"
description = "Ghost C2 Framework"
authors = ["Ghost Team"]

[tool.poetry.dependencies]
python = ">=3.10"
pycryptodome = "^3.20.0"
pyyaml = "^6.0"
requests = "^2.32.0"
psutil = "^6.0.0"
pefile = "^2023.2.7"
rsa = "^4.9"
netaddr = "^0.10.0"
ecdsa = "^0.18.0"
paramiko = "^3.3.1"
urllib3 = "^2.0.7"
netifaces = "^0.11.0"
pylzma = "^0.5.0"
colorama = "^0.4.6"
mss = "^9.0.1"
pyOpenSSL = "^23.2.0"
scapy = "^2.5.0"
impacket = "^0.10.0"
dnslib = "^0.9.23"
cerberus = "^1.3.5"
pygments = "^2.16.1"
tornado = "^6.3.3"
msgpack = "^1.0.6"
u-msgpack-python = "^2.8.0"
hexdump = "^3.3"
defusedxml = "^0.7.1"
dateparser = "^1.1.8"
pyelftools = "^0.30"
chardet = "^5.1.0"
tqdm = "^4.66.1"

[tool.poetry.dev-dependencies]
flake8 = "^7.0.0"
pytest = "^7.0.0"
black = "^24.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
